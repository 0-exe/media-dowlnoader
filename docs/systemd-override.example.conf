# Drop-in override for the media-downloader systemd service.
#
# HOW TO USE
# ----------
# 1. Enter the LXC shell from the Proxmox node:
#       pct enter <CTID>
#
# 2. Open the drop-in editor:
#       systemctl edit media-downloader
#
# 3. Copy the [Service] block below (or just the lines you need) into the
#    editor, save, and close.
#
# 4. Apply the changes and restart the service:
#       systemctl daemon-reload
#       systemctl restart media-downloader
#
# The resulting override file is stored at:
#   /etc/systemd/system/media-downloader.service.d/override.conf
#
# ─────────────────────────────────────────────────────────────────────────────

[Service]

# ── Secret key ────────────────────────────────────────────────────────────────
# Set this to keep browser sessions alive across service restarts.
# Generate a secure value with:  openssl rand -hex 32
Environment="SECRET_KEY=replace-with-a-long-random-string"

# ── Listening port ────────────────────────────────────────────────────────────
# Default is 8080. Change if that port is already in use on the container.
Environment="APP_PORT=8080"
